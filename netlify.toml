[build]
  command = "python3 build.py"
  publish = "dist"

# dist/ is committed as well, so the site still deploys if the build step is
# skipped (e.g. a manual drag-and-drop deploy of the dist folder).

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
