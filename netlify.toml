# Static site — no build step. `dist/` is produced by build-dist.py and is
# the only thing that ships; the repo root holds the working files.
#
#   python3 build-dist.py     # refresh dist/ after editing anything
#
# Response headers live in dist/_headers so that drag-and-drop deploys and
# git-based builds are governed by exactly the same rules.
[build]
  publish = "dist"
