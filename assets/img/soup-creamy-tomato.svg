    </g>
    <g stroke="#7E9448" stroke-width="1.4" fill="none">
      <path d="M120 74 L136 62"/><path d="M68 152 L84 140"/><path d="M138 143 L152 131"/>
    </g>
    <!-- croutons -->
    <g fill="#E6C88E">
