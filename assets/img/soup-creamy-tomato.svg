<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Bowl of creamy tomato soup with basil, seen from above">
  <defs>
    <clipPath id="ct-broth"><circle cx="100" cy="100" r="66"/></clipPath>
  </defs>
  <circle cx="100" cy="100" r="88" fill="#F6EAD6"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#C9A87C" stroke-width="2"/>
  <circle cx="100" cy="100" r="76" fill="#EFE0C6"/>
  <circle cx="100" cy="100" r="70" fill="#E4D2B2"/>
  <circle cx="100" cy="100" r="66" fill="#C8442A"/>
  <g clip-path="url(#ct-broth)">
