      <rect x="106" y="140" width="14" height="13" rx="3" transform="rotate(18 113 146)"/>
      <rect x="56" y="66" width="13" height="12" rx="3" transform="rotate(24 62 72)"/>
    </g>
    <g fill="#4A2E1B" opacity=".55">
