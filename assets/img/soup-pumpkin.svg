<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-label="Bowl of pumpkin soup with a cream swirl, seen from above">
  <defs>
    <radialGradient id="pk-broth" cx=".38" cy=".32" r=".78"><stop offset="0" stop-color="#E88C33"/><stop offset=".55" stop-color="#D2691E"/><stop offset="1" stop-color="#A94F12"/></radialGradient>
    <radialGradient id="pk-rim" cx=".5" cy=".5" r=".5">
      <stop offset=".82" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#4A2C18" stop-opacity=".26"/>
    </radialGradient>
    <linearGradient id="pk-glaze" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#FFFDF7"/>
      <stop offset=".5" stop-color="#F3E6CE"/>
      <stop offset="1" stop-color="#DFCDAC"/>
    </linearGradient>
    <clipPath id="pk-clip"><circle cx="180" cy="176" r="112"/></clipPath>
  </defs>

  <ellipse cx="180" cy="330" rx="132" ry="17" fill="#2E1D12" opacity=".13"/>

  <circle cx="180" cy="180" r="150" fill="url(#pk-glaze)"/>
  <circle cx="180" cy="180" r="150" fill="none" stroke="#C6A97C" stroke-width="1.5" opacity=".55"/>
  <circle cx="180" cy="178" r="126" fill="#E9D8B8"/>
  <circle cx="180" cy="176" r="112" fill="url(#pk-broth)"/>

  <g clip-path="url(#pk-clip)">
    <!-- cream swirl, poured -->
    <path d="M180 178 C202 178 214 160 202 142 C186 118 148 118 134 144
             C116 176 140 218 180 222 C232 226 262 190 252 148"
          fill="none" stroke="#F7EBD5" stroke-width="13" stroke-linecap="round" opacity=".95"/>
    <!-- pepitas -->
    <g fill="#69823C">
      <ellipse cx="238" cy="228" rx="15" ry="9" transform="rotate(28 238 228)"/>
      <ellipse cx="116" cy="238" rx="15" ry="9" transform="rotate(-18 116 238)"/>
      <ellipse cx="200" cy="262" rx="14" ry="8.5" transform="rotate(8 200 262)"/>
      <ellipse cx="92" cy="164" rx="13" ry="8" transform="rotate(-42 92 164)"/>
      <ellipse cx="246" cy="104" rx="13" ry="8" transform="rotate(34 246 104)"/>
    </g>
    <!-- cracked pepper and oil -->
    <g fill="#4A2E1B" opacity=".55">
      <circle cx="160" cy="150" r="3.4"/><circle cx="214" cy="196" r="3"/>
      <circle cx="146" cy="212" r="2.8"/><circle cx="192" cy="120" r="2.6"/>
      <circle cx="252" cy="176" r="2.6"/><circle cx="128" cy="186" r="2.4"/>
    </g>
    <!-- surface sheen -->
    <ellipse cx="140" cy="130" rx="66" ry="38" fill="#FFF3D8" opacity=".14" transform="rotate(-22 140 130)"/>
  </g>

  <circle cx="180" cy="176" r="112" fill="url(#pk-rim)"/>
  <circle cx="180" cy="176" r="112" fill="none" stroke="#8E5F1C" stroke-width="1.5" opacity=".35"/>
  <path d="M68 172a112 112 0 0 1 44-86" fill="none" stroke="#FFF6E4" stroke-width="4" stroke-linecap="round" opacity=".28"/>
</svg>
